<title>Tira-Dúvidas Fast Track</title>

     algum desses arquivos não estiver junto (ex.: abrindo este HTML

     silenciosamente e a ferramenta funciona normal, só sem virar app. -->

<meta name="theme-color" content="#5B2A86">
<link rel="icon" href="icon-192.png" type="image/png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F6F5FA;
  --surface:#FFFFFF;
  --surface-2:#EEEBF6;
  --border:#DEDAEA;
  --ink:#1A1425;
  --ink-soft:#615A73;
  --ink-faint:#8B84A0;
  --accent:#5B2A86;
  --accent-ink:#FFFFFF;
  --accent-soft:#EEE4F7;
  --accent-soft-ink:#4A2270;
  --bot-bubble:#EEEBF6;
  --user-bubble:#5B2A86;
  --user-bubble-ink:#FFFFFF;
  --warn-bg:#FBF0DE;
  --warn-border:#E6B564;
  --warn-ink:#7A4A12;
  --wa-bg:#E3F6E8;
  --wa-bg-hover:#D3F0DB;
  --wa-border:#B9E5C4;
  --wa-ink:#1F7A3D;
  --shadow:0 1px 2px rgba(26,20,37,0.05), 0 8px 24px -12px rgba(26,20,37,0.14);
  --radius:14px;
  color-scheme:light only;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:15px;
  line-height:1.55;
  height:100%;
}
html{height:100%;}
h1,h2,h3,h4{
  font-family:"Archivo",system-ui,sans-serif;
  margin:0;
  text-wrap:balance;
}
button{font-family:inherit;}
/* ---------- Header ---------- */
.topbar{
  padding:16px 20px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--border);
  background:var(--bg);
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand-mark{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  font-weight:600;
  letter-spacing:0.08em;
  color:var(--accent);
  background:var(--accent-soft);
  padding:3px 7px;
  border-radius:6px;
}
.brand-title{font-size:18px;font-weight:800;letter-spacing:-0.01em;}
.brand-sub{font-size:12.5px;color:var(--ink-faint);flex:1 1 auto;}
.nav-toggle{
  display:none;
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
  font-weight:600;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--ink-soft);
  border-radius:8px;
  padding:8px 10px;
  cursor:pointer;
}
/* ---------- Layout ---------- */
.app{
  max-width:1180px;
  margin:0 auto;
  padding-inline:20px;
  display:grid;
  grid-template-columns:280px 1fr;
  gap:20px;
  align-items:start;
  padding-block:20px;
}
.sidebar{
  position:sticky;
  top:20px;
  max-height:calc(100vh - 40px);
  overflow-y:auto;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px;
}
.sidebar-title{
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  font-weight:600;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--ink-faint);
  padding:2px 6px 10px;
}
.cat-block{margin-bottom:6px;}
.cat-head{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:none;
  border:none;
  text-align:left;
  padding:9px 8px;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
  color:var(--ink);
  cursor:pointer;
}
.cat-head:hover{background:var(--surface-2);}
.cat-head .chev{
  color:var(--ink-faint);
  font-size:11px;
  transition:transform .15s ease;
  flex-shrink:0;
}
.cat-block.open .cat-head .chev{transform:rotate(90deg);}
.cat-questions{
  list-style:none;
  margin:0;
  padding:2px 0 8px 10px;
  display:none;
  flex-direction:column;
  gap:2px;
}
.cat-block.open .cat-questions{display:flex;}
.cat-questions button{
  width:100%;
  text-align:left;
  background:none;
  border:none;
  border-left:2px solid var(--border);
  padding:6px 10px;
  font-size:12.5px;
  color:var(--ink-soft);
  cursor:pointer;
  border-radius:0 6px 6px 0;
}
.cat-questions button:hover{background:var(--surface-2);color:var(--ink);border-left-color:var(--accent);}
.cat-questions button.draft::after{
  content:" · rascunho";
  color:var(--warn-ink);
  font-size:11px;
}
/* ---------- Chat ---------- */
.chat-wrap{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  height:calc(100vh - 40px);
  min-height:480px;
  overflow:hidden;
}
.chat-scroll{
  flex:1 1 auto;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.msg{display:flex;gap:10px;max-width:85%;}
.msg.bot{align-self:flex-start;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.avatar{
  flex-shrink:0;
  width:30px;
  height:30px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"IBM Plex Mono",monospace;
  font-size:11px;
  font-weight:700;
}
.msg.bot .avatar{background:var(--accent);color:var(--accent-ink);}
.msg.user .avatar{background:var(--surface-2);color:var(--ink-soft);}
.bubble{
  border-radius:14px;
  padding:11px 14px;
  font-size:13.5px;
  white-space:pre-line;
}
.msg.bot .bubble{
  background:var(--bot-bubble);
  color:var(--ink);
  border-top-left-radius:4px;
}
.msg.user .bubble{
  background:var(--user-bubble);
  color:var(--user-bubble-ink);
  border-top-right-radius:4px;
}
.bubble a{color:var(--accent);font-weight:600;word-break:break-all;}
.msg.user .bubble a{color:inherit;text-decoration-color:currentColor;}
.bubble .draft-tag{
  display:inline-block;
  margin-top:8px;
  font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--warn-ink);
  background:var(--warn-bg);
  border:1px solid var(--warn-border);
  border-radius:6px;
  padding:2px 7px;
}
.bubble .related-label{
  margin-top:10px;
  font-size:11.5px;
  color:var(--ink-faint);
}
.wa-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}
.wa-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--wa-bg);
  color:var(--wa-ink);
  border:1px solid var(--wa-border);
  border-radius:999px;
  padding:7px 13px;
  font-size:12.5px;
  font-weight:600;
  text-decoration:none;
  line-height:1.2;
}
.wa-btn:hover{background:var(--wa-bg-hover);}
.suggestions{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:8px;
}
.suggestions button{
  text-align:left;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:7px 10px;
  font-size:12.5px;
  color:var(--accent);
  cursor:pointer;
}
.suggestions button:hover{border-color:var(--accent);background:var(--accent-soft);}
.option-buttons{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:10px;
}
.option-btn{
  text-align:left;
  background:var(--accent-soft);
  border:1px solid var(--accent-soft);
  border-radius:8px;
  padding:8px 11px;
  font-size:12.5px;
  font-weight:600;
  color:var(--accent-soft-ink);
  cursor:pointer;
}
.option-btn:hover{border-color:var(--accent);}
.chips-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:0 20px 16px;
}
.chip{
  background:var(--accent-soft);
  color:var(--accent-soft-ink);
  border:none;
  border-radius:999px;
  padding:7px 13px;
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
  flex-shrink:0;
}
.chip:hover{filter:brightness(0.96);}
.chat-input-row{
  border-top:1px solid var(--border);
  padding:14px 16px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;
  gap:10px;
  flex-shrink:0;
}
.chat-input{
  flex:1 1 auto;
  font-family:inherit;
  font-size:14px;
  color:var(--ink);
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:11px 14px;
}
.chat-input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.send-btn{
  background:var(--accent);
  color:var(--accent-ink);
  border:none;
  border-radius:10px;
  padding:0 18px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  flex-shrink:0;
}
.send-btn:hover{filter:brightness(1.06);}
.escalation{
  font-size:12px;
  color:var(--ink-faint);
  text-align:center;
  padding:0 20px 14px;
}
/* ---------- Responsive ---------- */
@media (max-width:860px){
  .app{grid-template-columns:1fr;padding-inline:12px;padding-block:12px;gap:12px;}
  .nav-toggle{display:inline-block;}
  .brand-sub{display:none;}
  .sidebar{
    position:static;
    max-height:none;
    display:none;
  }
  .sidebar.open{display:block;}
  .chat-wrap{
    height:calc(100vh - 96px);
    height:calc(100dvh - 96px);
  }
  .chat-scroll{padding:14px;}
  .chips-row{
    flex-wrap:nowrap;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding:0 14px 14px;
  }
  .chips-row::-webkit-scrollbar{display:none;}
  .msg{max-width:92%;}
}
</style>
</head>

<div class="topbar">
  <div class="brand">
    <span class="brand-mark">24H</span>
    <span class="brand-title">Tira-Dúvidas Fast Track</span>
  </div>

    <div class="chat-scroll" id="chatScroll"></div>

</div>

      "draft": false,
      "needsTurma": false,
      "turmaPrompt": "",
      "turmaAnswerPrefix": "",
      "turmaLinks": {},
      "turmaUnavailable": {},
      "turmaFollowUp": "",
      "options": []
    }
  ],
  "irisButton": {
    "label": "💬 Íris — Suporte geral InvestSmart",
    "url": "https://wa.me/5521972646115"
  },
  "captainButtons": [
    {
      "label": "💬 Yuri de Carvalho — Turma 38",
      "url": "https://wa.me/5521980963410"
    },
    {
      "label": "💬 Rafael Bertelli — Turma 38",
      "url": "https://wa.me/553584016188"
    },
    {
      "label": "💬 Pollyanna Antunes — Turma 38",
      "url": "https://wa.me/558488422910"
    },
    {
      "label": "💬 Hudson Machado — Turma 39",
      "url": "https://wa.me/5511971170142"
    },
    {
      "label": "💬 Mariana Maia — Turma 40",
      "url": "https://wa.me/5521995419132"
    },
    {
      "label": "💬 Eros Fonseca — Turma 40",
      "url": "https://wa.me/558699501096"
    },
    {
      "label": "💬 Julia Siqueira",
      "url": "https://wa.me/5521970345408"
    },
    {
      "label": "💬 Ravel Brito",
      "url": "https://wa.me/5512996689043"
    }
  ]
};

(function(){
  // ---- Mobile sidebar toggle ----
  var navToggle = document.getElementById('navToggle');
  var sidebar = document.getElementById('sidebar');
  navToggle.addEventListener('click', function(){
    var open = sidebar.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // ---- Build sidebar (accordion by category) ----
  var catListEl = document.getElementById('catList');
  var faqById = {};
  FAQ_DATA.faqs.forEach(function(f){ faqById[f.id] = f; });
  var IRIS_BUTTON = FAQ_DATA.irisButton;
  var CAPTAIN_BUTTONS = FAQ_DATA.captainButtons || [];

  FAQ_DATA.categories.forEach(function(cat, idx){
    var block = document.createElement('div');
    block.className = 'cat-block' + (idx === 0 ? ' open' : '');
    var head = document.createElement('button');
    head.className = 'cat-head';
    head.type = 'button';
    head.innerHTML = '<span>' + cat.label + '</span><span class="chev">&#9656;</span>';
    head.addEventListener('click', function(){ block.classList.toggle('open'); });
    var list = document.createElement('ul');
    list.className = 'cat-questions';
    FAQ_DATA.faqs.filter(function(f){ return f.cat === cat.id; }).forEach(function(f){
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.textContent = f.q;
      if(f.draft) btn.className = 'draft';
      btn.addEventListener('click', function(){
        askQuestion(f.q, f.id);
        if(window.matchMedia('(max-width:860px)').matches){
          sidebar.classList.remove('open');
          navToggle.setAttribute('aria-expanded','false');
        }
      });
      li.appendChild(btn);
      list.appendChild(li);
    });
    block.appendChild(head);
    block.appendChild(list);
    catListEl.appendChild(block);
  });

  // ---- Fuzzy search ----
  var searchList = FAQ_DATA.faqs.map(function(f){
    return { id: f.id, q: f.q, variants: f.variants || [], cat: f.cat };
  });
  var fuse = null;
  try{
    fuse = new Fuse(searchList, {
      keys: [
        { name: 'q', weight: 0.5 },
        { name: 'variants', weight: 0.5 }
      ],
      threshold: 0.42,
      ignoreLocation: true,
      minMatchCharLength: 3,
    });
  }catch(e){ fuse = null; }

  // ---- Chat rendering ----
  var chatScroll = document.getElementById('chatScroll');
  var chipsRow = document.getElementById('chipsRow');

  function scrollToBottom(){
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }

  function escapeHtml(s){
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }
  function linkify(text){
    var escaped = escapeHtml(text);
    return escaped.replace(/(https?:\/\/[^\s]+)/g, function(url){
      return '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>';
    });
  }

  function addUserMessage(text){
    var msg = document.createElement('div');
    msg.className = 'msg user';
    msg.innerHTML = '<div class="avatar">Você</div><div class="bubble"></div>';
    msg.querySelector('.bubble').textContent = text;
    chatScroll.appendChild(msg);
    scrollToBottom();
  }

  function addBotAnswer(faq){
    var msg = document.createElement('div');
    msg.className = 'msg bot';
    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'FT';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = linkify(faq.a);
    if(faq.draft){
      var tag = document.createElement('div');
      tag.className = 'draft-tag';
      tag.textContent = 'Resposta em validação';
      bubble.appendChild(tag);
    }
    if(faq.links && faq.links.length){
      var rel = document.createElement('div');
      rel.className = 'related-label';
      rel.textContent = 'Material relacionado: ' + faq.links.join(' · ');
      bubble.appendChild(rel);
    }
    if(faq.buttons && faq.buttons.length){
      var waBox = document.createElement('div');
      waBox.className = 'wa-buttons';
      faq.buttons.forEach(function(btn){
        var a = document.createElement('a');
        a.className = 'wa-btn';
        a.href = btn.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = btn.label;
        waBox.appendChild(a);
      });
      bubble.appendChild(waBox);
    }
    if(faq.options && faq.options.length){
      var optBox = document.createElement('div');
      optBox.className = 'option-buttons';
      faq.options.forEach(function(opt){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'option-btn';
        b.textContent = opt.label;
        b.addEventListener('click', function(){ selectFaqOption(opt); });
        optBox.appendChild(b);
      });
      bubble.appendChild(optBox);
    }
    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatScroll.appendChild(msg);
    scrollToBottom();
  }

  // ---- Resposta com opções (ex.: "meus números não batem no KPI") ----
  // Em vez de jogar todos os casos numa resposta só, a pergunta mostra uma
  // introdução + botões; ao clicar, mostra só a resposta daquele caso.
  function selectFaqOption(opt){
    addUserMessage(opt.label);
    setTimeout(function(){
      addBotAnswer({
        a: opt.a,
        links: opt.links || [],
        buttons: opt.buttons || [],
        options: [],
        draft: false,
      });
    }, 220);
  }

  function addBotText(text){
    var msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.innerHTML = '<div class="avatar">FT</div><div class="bubble"></div>';
    msg.querySelector('.bubble').innerHTML = linkify(text);
    chatScroll.appendChild(msg);
    scrollToBottom();
  }

  // ---- Turma-dependent answers (ex.: Entrega de Tarefas, FP Client) ----
  var pendingTurmaFor = null; // id do FAQ aguardando a turma
  var TURMA_WORDS = { 'trinta e sete':'37', 'trinta e oito':'38', 'trinta e nove':'39', 'quarenta':'40' };

  function extractTurma(text){
    var t = text.toLowerCase();
    for(var word in TURMA_WORDS){
      if(t.indexOf(word) !== -1) return TURMA_WORDS[word];
    }
    var m = t.match(/\b(37|38|39|40)\b/);
    return m ? m[1] : null;
  }

  function resolveTurmaAnswer(faq, turma){
    var link = faq.turmaLinks && faq.turmaLinks[turma];
    if(link){
      addBotText((faq.turmaAnswerPrefix || 'Segue o link:') + ' ' + link +
        (faq.turmaFollowUp ? '\n\n' + faq.turmaFollowUp : ''));
      return;
    }
    var note = faq.turmaUnavailable && faq.turmaUnavailable[turma];
    if(note){
      addBotText(note);
      return;
    }
    addBotText('Hmm, não tenho o link dessa turma (' + turma + ') cadastrado ainda — fala com o capitão da sua turma que ele te ajuda.');
  }

  function addBotFallback(suggestions){
    var msg = document.createElement('div');
    msg.className = 'msg bot';
    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'FT';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.appendChild(document.createTextNode(
      'Ainda não encontrei uma resposta certeira pra essa pergunta, desculpa! ' +
      (suggestions.length ? 'Talvez uma dessas ajude:' : 'Mas você pode falar direto com a Íris ou com o capitão da sua turma:')
    ));
    if(suggestions.length){
      var box = document.createElement('div');
      box.className = 'suggestions';
      suggestions.forEach(function(f){
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = f.q;
        b.addEventListener('click', function(){ askQuestion(f.q, f.id); });
        box.appendChild(b);
      });
      bubble.appendChild(box);
      var relLabel = document.createElement('div');
      relLabel.className = 'related-label';
      relLabel.textContent = 'Ou fale direto com alguém:';
      bubble.appendChild(relLabel);
    }
    var waBox = document.createElement('div');
    waBox.className = 'wa-buttons';
    var contacts = (IRIS_BUTTON ? [IRIS_BUTTON] : []).concat(CAPTAIN_BUTTONS);
    contacts.forEach(function(btn){
      var a = document.createElement('a');
      a.className = 'wa-btn';
      a.href = btn.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = btn.label;
      waBox.appendChild(a);
    });
    bubble.appendChild(waBox);
    msg.appendChild(avatar);
    msg.appendChild(bubble);
    chatScroll.appendChild(msg);
    scrollToBottom();
  }

  // ---- Repúdio explícito a dados sensíveis ----
  // Checagem simples client-side (heurística, não é um filtro perfeito):
  // se o texto digitado parecer ter CPF, número de cartão, CVV ou uma
  // senha/dado bancário explícito, o bot recusa processar e direciona pra
  // Íris em vez de tentar casar com alguma pergunta do FAQ.
  var SENSITIVE_PATTERNS = [
    /\b\d{3}\.?\d{3}\.?\d{3}-?\d{2}\b/,      // CPF (com ou sem pontuação)
    /\b(?:\d[ .-]?){13,19}\b/,                // possível número de cartão
    /\bcvv\b/i,
    /senha\s*[:=]/i,
    /minha senha\s+(é|eh|:)/i,
    /n[uú]mero do cart[aã]o/i,
    /conta\s*corrente.{0,15}\d{4,}/i,
  ];
  function looksSensitive(text){
    return SENSITIVE_PATTERNS.some(function(re){ return re.test(text); });
  }

  function askQuestion(text, knownId){
    addUserMessage(text);

    // Repúdio a dados sensíveis vem antes de qualquer outra lógica —
    // inclusive interrompe um fluxo de "aguardando turma" em andamento.
    if(!knownId && looksSensitive(text)){
      pendingTurmaFor = null;
      setTimeout(function(){
        addBotAnswer({
          a: 'Opa, não! Por segurança eu não processo isso — parece que sua mensagem tem um dado sensível (senha, CPF, cartão ou parecido). Apaga essa informação por aqui. Se precisar de ajuda com algo assim, fala direto com a Íris ou com o seu capitão, pelos canais oficiais:',
          buttons: (IRIS_BUTTON ? [IRIS_BUTTON] : []),
          links: [],
          draft: false,
        });
      }, 220);
      return;
    }

    // Se estávamos esperando a turma pra uma pergunta anterior (ex.: Entrega
    // de Tarefas / FP Client), tenta resolver a turma primeiro.
    if(pendingTurmaFor && !knownId){
      var turma = extractTurma(text);
      var faqPending = faqById[pendingTurmaFor];
      if(turma){
        pendingTurmaFor = null;
        setTimeout(function(){ resolveTurmaAnswer(faqPending, turma); }, 220);
        return;
      } else {
        setTimeout(function(){
          addBotText('Desculpa, não entendi a turma 😅 Pode me dizer só o número (37, 38, 39 ou 40)?');
        }, 220);
        return;
      }
    }

    var faq = knownId ? faqById[knownId] : null;
    if(!faq && fuse){
      var results = fuse.search(text);
      if(results.length && results[0].score <= 0.45){
        faq = faqById[results[0].item.id];
      }
    }
    setTimeout(function(){
      if(faq && faq.needsTurma){
        pendingTurmaFor = faq.id;
        addBotText(faq.turmaPrompt || 'Qual é a sua turma?');
      } else if(faq){
        addBotAnswer(faq);
      } else {
        var suggestions = [];
        if(fuse){
          var results = fuse.search(text);
          suggestions = results.slice(0, 3).map(function(r){ return faqById[r.item.id]; });
        }
        if(!suggestions.length){
          suggestions = FAQ_DATA.faqs.slice(0, 3);
        }
        addBotFallback(suggestions);
      }
    }, 220);
  }

  // ---- Quick-start chips ----
  var startIds = ['form-entrega-tarefas', 'numeros-nao-batem-kpi', 'marcadores-bitrix', 'quem-sao-capitaes'];
  startIds.forEach(function(id){
    var f = faqById[id];
    if(!f) return;
    var chip = document.createElement('button');
    chip.className = 'chip';
    chip.type = 'button';
    chip.textContent = f.q;
    chip.addEventListener('click', function(){ askQuestion(f.q, f.id); });
    chipsRow.appendChild(chip);
  });

  // ---- Welcome message ----
  (function(){
    var msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.innerHTML = '<div class="avatar">FT</div><div class="bubble"></div>';
    msg.querySelector('.bubble').textContent =
      'Oi, tudo bem? 😊 Eu ajudo com dúvidas operacionais do Fast Track — cronograma, ranking de KPI, presença, formulários e afins.\n\n' +
      'Digite sua dúvida abaixo, ou escolha um tema na lista ao lado (ou aqui embaixo). E lembrando: nunca me manda senha, CPF, cartão ou qualquer dado sensível — pra isso, fala direto com a Íris ou seu capitão.';
    chatScroll.appendChild(msg);
  })();

  // ---- Input handling ----
  var chatInput = document.getElementById('chatInput');
  var sendBtn = document.getElementById('sendBtn');
  function submitInput(){
    var text = chatInput.value.trim();
    if(!text) return;
    askQuestion(text, null);
    chatInput.value = '';
  }
  sendBtn.addEventListener('click', submitInput);
  chatInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ submitInput(); }
  });

  // ---- PWA: registra o service worker pra funcionar offline e ser
  // instalável ("Adicionar à tela inicial"). Se service-worker.js não
  // existir junto (ex.: abrindo o HTML direto, fora de um link https),
  // isso falha silenciosamente e o resto continua funcionando normal.
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(){});
    });
  }
})();
</script>
